name: C++ core checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ohlsnamer-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and zlib headers
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev
      - name: Compile CLI with warnings
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic core_cli.cpp -lz -o core_cli
      - name: Compile and run regression tests
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic core_tests.cpp -lz -o core_tests && ./core_tests
      - name: Audit every committed OLS fixture
        shell: bash
        run: |
          shopt -s nullglob
          fixture_files=(olstest/*.ols)
          root_files=( *.ols )
          files=("${fixture_files[@]}" "${root_files[@]}")
          test "${#fixture_files[@]}" -ge 9
          MAP_AUDIT=1 ./core_cli "${files[@]}" > olstest-map-audit.txt
          test "$(grep -c '^  map-audit total=' olstest-map-audit.txt)" -eq "${#files[@]}"
          test "$(grep -c '^  map-record index=' olstest-map-audit.txt)" -gt 0
          declare -A expected_defined=(
            ["Alfa Romeo 147 EDC15 0281010332 (33).ols"]=33
            ["Audi A4 EDC15 038906019LJ (88).ols"]=88
            ["BMW 3er EDC17CP02 08506199 (24).ols"]=0
            ["Chrysler Voyager 0281010814 (17).ols"]=17
            ["Dacia Duster SID305306 (2).ols"]=2
            ["Ford Transit EPIC (9).ols"]=9
            ["Honda Civic SH7058 (76).ols"]=76
            ["Jaguar XK 0030650093 A (12667).ols"]=12667
            ["MB E200 MED17.7.2 (0).ols"]=0
            ["Subaru impreza denso (292).ols"]=292
            ["Toyota FJ35 DENSO (8).ols"]=8
            ["Toyota Hiace 89663 26432 (14).ols"]=0
            ["Toyota Hilux RX703200 (0).ols"]=0
            ["Toyota Unknown SHXX (57).ols"]=57
            ["Toyota Yaris GR R7F701216 (0).ols"]=0
            ["VW Crafter EDC16CP34 (2).ols"]=2
            ["VW Golf4 038906012L 0281010112 (14).ols"]=14
            ["Audi A2 EDC15 0281011100 (2).ols"]=0
            ["Audi Q3 EDC17C46 03L906018CM (47).ols"]=0
            ["Audi Q3 EDC17C46 03L906018CN (47).ols"]=0
            ["Mazda 6 Denso 8 R2BG 188K2 E (2).ols"]=0
            ["Opel Vectra EDC16C9 0281013409 (1).ols"]=0
            ["Audi Q5 EDC17CP14 (1).ols"]=0
            ["Mitsubishi ASX Denso 16 T1B1HEB1DV01 (1).ols"]=0
            ["Nissan Navara Denso 16 E311U4D (2).ols"]=0
            ["Subaru Impreza Denso 8 (3).ols"]=0
            ["Volvo C70 EDC16C31 (1).ols"]=0
          )
          for f in "${files[@]}"; do
            base=${f##*/}
            expected=${expected_defined[$base]:-}
            test -n "$expected" || { echo "Missing expected map-count fixture: $base"; exit 1; }
            actual=$(awk -v file="$f" '$0 == file { found=1; next } found && /^  map-audit total=/ { if (match($0, /defined=[0-9]+/)) { print substr($0, RSTART+8, RLENGTH-8); exit } }' olstest-map-audit.txt)
            if [ "$actual" != "$expected" ]; then echo "Map count mismatch: $base expected=$expected actual=$actual"; exit 1; fi
          done
          echo "=== OLS fixture map-count summary ==="
          awk '/^olstest\// { file=$1; sub(/\.ols$/, "", file); next } /^  ok=/ { if (match($0, /maps=[0-9]+ defined=[0-9]+ skipped=[0-9]+/)) print file " " substr($0, RSTART, RLENGTH); next } /^  map-audit total=/ { print file " " $0 }' olstest-map-audit.txt
      - name: Upload complete OLS map audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ols-map-audit-${{ github.sha }}
          path: olstest-map-audit.txt
          if-no-files-found: warn
      - name: Run regression tests with address and undefined-behavior sanitizers
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -fsanitize=address,undefined -fno-omit-frame-pointer core_tests.cpp -lz -o core_tests_sanitized && ASAN_OPTIONS=detect_leaks=1 ./core_tests_sanitized
      - name: Compile independent OLS reference parser
        run: gcc -std=c99 -Wall -Wextra -Wpedantic -D_POSIX_C_SOURCE=200809L third_party/ols-parser-public/ols.c third_party/ols-parser-public/ols_dump.c -lm -o ols_dump
      - name: Check reference parser CLI usage path
        shell: bash
        run: |
          set +e
          ./ols_dump >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
      - name: Audit map labels with independent reference parser
        shell: bash
        run: |
          shopt -s nullglob
          fixture_files=(olstest/*.ols)
          root_files=( *.ols )
          files=("${fixture_files[@]}" "${root_files[@]}")
          : > olstest-reference-map-audit.txt
          for f in "${files[@]}"; do
            echo "$f" >> olstest-reference-map-audit.txt
            ./ols_dump "$f" >> olstest-reference-map-audit.txt 2>&1 || echo "REFERENCE_PARSE_FAILED $f" >> olstest-reference-map-audit.txt
          done
          test "$(grep -c '^── MAPS (' olstest-reference-map-audit.txt)" -gt 0
          echo "=== Independent parser map counts ==="
          awk '/^olstest\// { file=$0; next } /^── MAPS \(/ { print file " " $0 }' olstest-reference-map-audit.txt
      - name: Upload independent reference map audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ols-reference-map-audit-${{ github.sha }}
          path: olstest-reference-map-audit.txt
          if-no-files-found: warn
      - name: Install archive tools (zip, 7-Zip, RAR) for archive tests
        run: |
          sudo apt-get install -y zip unzip p7zip-full sharutils
          sudo apt-get install -y rar unrar || echo "rar/unrar unavailable: RAR creation tests will be skipped"
      - name: Build archive CLI and archive unit tests
        run: sh ./build_archive_cli.sh && ./archive_tests
      - name: Archive unit tests with address and undefined-behavior sanitizers
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer archive_tests.cpp ols_unrar.cpp build/linux/libunrar.a -lz -pthread -o archive_tests_sanitized
          ASAN_OPTIONS=detect_leaks=1 ./archive_tests_sanitized
      - name: ZIP/RAR integration (scan, rename, validate with unzip/7z/python/unrar/rar)
        run: g++ -std=c++17 -O2 core_cli.cpp -lz -o core_cli && bash tests/archive_integration.sh "$RUNNER_TEMP/archive-it"
      - name: RAR writer against libarchive's RAR4/RAR5 sample archives
        shell: bash
        run: |
          command -v unrar >/dev/null && command -v rar >/dev/null || { echo "rar/unrar unavailable; skipped"; exit 0; }
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/libarchive/libarchive "$RUNNER_TEMP/libarchive"
          git -C "$RUNNER_TEMP/libarchive" sparse-checkout set libarchive/test
          mkdir -p "$RUNNER_TEMP/rarcorpus"
          for u in "$RUNNER_TEMP"/libarchive/libarchive/test/test_*rar*.uu; do
            case $u in *.Z.uu) continue;; esac
            uudecode -o "$RUNNER_TEMP/rarcorpus/$(basename "${u%.uu}")" "$u" || true
          done
          bash tests/rar_format_corpus.sh "$RUNNER_TEMP/rarcorpus" "$RUNNER_TEMP/rarwork"
      - name: Install MinGW cross-compiler
        run: sudo apt-get install -y g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 libz-mingw-w64-dev
      - name: Cross-compile Win32 GUI release executable
        run: sh ./build.sh
      - name: Read release version
        id: version
        run: echo "version=$(tr -d '\\r\\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Publish Windows x64 executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhlsNamer-v${{ steps.version.outputs.version }}-windows-x64
          path: OLS Renamer.exe
          if-no-files-found: error
