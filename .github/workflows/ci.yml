name: C++ core checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ohlsnamer-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and zlib headers
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev
      - name: Compile CLI with warnings
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic core_cli.cpp -lz -o core_cli
      - name: Compile and run regression tests
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic core_tests.cpp -lz -o core_tests && ./core_tests
      - name: Compile independent OLS reference parser
        run: gcc -std=c99 -Wall -Wextra -Wpedantic -D_POSIX_C_SOURCE=200809L third_party/ols-parser-public/ols.c third_party/ols-parser-public/ols_dump.c -lm -o ols_dump
      - name: Check reference parser CLI usage path
        shell: bash
        run: |
          set +e
          ./ols_dump >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
      - name: Install MinGW cross-compiler
        run: sudo apt-get install -y g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 libz-mingw-w64-dev
      - name: Cross-compile Win32 GUI release executable
        run: sh ./build.sh
      - name: Read release version
        id: version
        run: echo "version=$(tr -d '\\r\\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Publish Windows x64 executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhlsNamer-v${{ steps.version.outputs.version }}-windows-x64
          path: OLS Renamer.exe
          if-no-files-found: error
